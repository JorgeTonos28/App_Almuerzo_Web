name: Build and security checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: dotnet restore Almuerzo.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
      - run: dotnet build Almuerzo.sln --no-restore -c Release
      - run: dotnet test Almuerzo.sln --no-build -c Release
      - run: dotnet publish src/Almuerzo.Web --no-build -c Release -o artifacts/publish
